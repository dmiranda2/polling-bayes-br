name: Historical polling error experiment

on:
  push:
    branches: [v1-historical-error]
    paths:
      - 'src/historical_error.py'
      - 'tests/test_historical_error.py'
      - 'data/presidential_first_round_results.csv'
      - 'data/pollster_aliases.csv'
      - '.github/workflows/historical-error.yml'
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_historical_error.py
      - name: Run Brazil historical calibration
        run: python src/historical_error.py --windows 3,7,14 --output-dir output_historical_error
      - name: Show compact diagnostics
        run: |
          echo '=== FIT SUMMARY ==='
          cat output_historical_error/historical_error_fit_summary.csv
          echo '=== LOO METRICS ==='
          cat output_historical_error/historical_error_loo_metrics.csv
          echo '=== JACKKNIFE ==='
          cat output_historical_error/historical_error_jackknife.csv
      - uses: actions/upload-artifact@v4
        with:
          name: historical-error-calibration
          path: output_historical_error/
          if-no-files-found: error