name: First-round bias retrospective

on:
  push:
    branches: [main]
    paths:
      - 'src/first_round_counterfactual.py'
      - 'tests/test_first_round_counterfactual.py'
      - 'docs/FIRST_ROUND_BIAS_RETROSPECTIVE.md'
      - '.github/workflows/first-round-bias-retrospective.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src pytest -q tests/test_first_round_counterfactual.py
      - run: python -m py_compile src/first_round_counterfactual.py
