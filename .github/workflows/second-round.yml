name: Second-round polling model

on:
  push:
    branches: [v1-historical-error, main, feature/round-and-historical-windows]
    paths:
      - 'src/historical_error.py'
      - 'src/historical_second_round.py'
      - 'src/historical_calibration.py'
      - 'src/runoff_nowcast.py'
      - 'src/runoff_calendar.py'
      - 'tests/test_second_round.py'
      - 'tests/test_runoff_two_modes.py'
      - 'tests/test_historical_windows.py'
      - 'data/presidential_second_round_results.csv'
      - 'data/manual_second_round_2026.csv'
      - 'data/scheduled_polls_2026_10_10.csv'
      - '.github/workflows/second-round.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: |
          pip install -r requirements.txt pytest tabulate
      - name: Regression tests, including first-round model
        run: PYTHONPATH=src pytest -q
      - name: Calibrate second-round history ONLY
        run: |
          python src/historical_calibration.py \
            --round 2 --windows 1:3,1:7,1:14,14:21 \
            --out output_history_rounds/round_2
      - name: Reproduce 9 October runoff nowcast using two historical windows
        run: |
          python src/runoff_nowcast.py \
            --as-of 2026-10-09 \
            --history output_history_rounds/round_2/historical_poll_errors.csv \
            --historical-window 1:7 \
            --out output_second_round
          python src/runoff_nowcast.py \
            --as-of 2026-10-09 \
            --history output_history_rounds/round_2/historical_poll_errors.csv \
            --historical-window 14:21 \
            --out output_second_round_14_21
          cat output_second_round/report_2026-10-09.md
          cat output_second_round_14_21/report_2026-10-09.md
          python src/runoff_nowcast.py \
            --as-of 2026-10-10 \
            --history output_history_rounds/round_2/historical_poll_errors.csv \
            --historical-window 14:21 \
            --out output_second_round_2026_10_10
          cat output_second_round_2026_10_10/report_2026-10-10.md
      - name: Upload complete audit and estimates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-round-only-2026-10-10
          path: |
            output_second_round/
            output_second_round_14_21/
            output_second_round_2026_10_10/
            output_history_rounds/
          if-no-files-found: warn
          retention-days: 60
